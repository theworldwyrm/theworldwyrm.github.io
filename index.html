<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photography Portfolio</title>
  <meta name="description" content="Photography portfolio">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="style.css?v=3">
  <!-- When you change photos.js, style.css or script.js, bump the ?v= number so browsers fetch the new copy. -->
</head>
<body>
  <header class="site-header">
    <a href="#" class="brand"><img src="logo.svg" alt="" class="logo" width="40" height="40"><span id="site-name"></span><small id="site-tagline"></small></a>
    <nav>
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="hero">
      <div class="hero-text">
        <h1 id="hero-name"></h1>
        <p id="hero-tagline"></p>
        <a href="#work" class="btn">View work</a>
      </div>
    </section>

    <section id="work" class="work">
      <div class="filters" id="filters"></div>
      <div class="gallery" id="gallery"></div>
    </section>

    <section id="about" class="about">
      <h2>About</h2>
      <p id="about-text"></p>
    </section>

    <section id="contact" class="contact">
      <h2>Contact</h2>
      <p>Available for portraits, events and collaborations.</p>
      <p class="contact-links">
        <a id="email-link" href="#"></a>
        <a id="insta-link" href="#" target="_blank" rel="noopener">Instagram</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> <span id="footer-name"></span>. All rights reserved.</p>
  </footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-prev" aria-label="Previous">&#8249;</button>
    <figure>
      <img id="lb-img" alt="">
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <button class="lb-next" aria-label="Next">&#8250;</button>
  </div>

  <script src="photos.js?v=3"></script>
  <script src="script.js?v=3"></script>
</body>
</html>
